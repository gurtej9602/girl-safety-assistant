<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Girl Safety Assistant</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Heading -->
        <h1>🌸 Girl Safety Assistant</h1>

        <p>Your safety is important. I'm here to help.</p>

        <!-- Chat Box -->
        <div class="chat-box">

            <div class="bot-message">
                Hello! How can I help you today?
            </div>

        </div>

        <!-- Input Area -->
        <div class="input-area">

            <input
                type="text"
                id="userInput"
                placeholder="Type your message here..."
            >

            <button id="sendButton">
                Send
            </button>

        </div>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
